name: Windows CI and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      publish: ${{ steps.metadata.outputs.publish }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # pinned 2026-07-18
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Resolve version and trusted release context
        id: metadata
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATE_SIGNER_CERT_SHA256: ${{ vars.UPDATE_SIGNER_CERT_SHA256 }}
        run: .\scripts\release-metadata.ps1
      - name: Check, test, and build release once
        shell: pwsh
        run: .\scripts\check.ps1
      - name: Stage tested executable without rebuilding
        shell: pwsh
        run: .\scripts\build-release.ps1 -SkipBuild
      - name: Prepare signing material for trusted releases only
        if: steps.metadata.outputs.signed == 'true'
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) { throw 'WINDOWS_SIGNING_PFX_BASE64 is required; refusing unsigned fallback' }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) { throw 'WINDOWS_SIGNING_PFX_PASSWORD is required' }
          $pfx = Join-Path $env:RUNNER_TEMP 'SpeakTypeCloud-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          .\scripts\sign-artifacts.ps1 -Path .\dist\release\SpeakTypeCloud.exe -PfxPath $pfx -PasswordEnv SIGNING_PFX_PASSWORD -ExpectedSignerCertSha256 $env:SPEAKTYPE_UPDATE_SIGNER_CERT_SHA256
      - name: Install hash-pinned NSIS build tool
        shell: pwsh
        run: .\scripts\install-nsis-build-tool.ps1
      - name: Build installer from tested application
        shell: pwsh
        run: .\scripts\build-installer.ps1 -SkipBuild
      - name: Sign installer
        if: steps.metadata.outputs.signed == 'true'
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $installer = Join-Path $PWD "dist\installer\SpeakTypeCloud-Setup-$env:RELEASE_VERSION.exe"
          $pfx = Join-Path $env:RUNNER_TEMP 'SpeakTypeCloud-signing.pfx'
          .\scripts\sign-artifacts.ps1 -Path $installer -PfxPath $pfx -PasswordEnv SIGNING_PFX_PASSWORD -ExpectedSignerCertSha256 $env:SPEAKTYPE_UPDATE_SIGNER_CERT_SHA256
      - name: Generate manifest only after installer signing
        if: steps.metadata.outputs.signed == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          .\scripts\new-update-manifest.ps1 -InstallerPath ".\dist\installer\SpeakTypeCloud-Setup-$env:RELEASE_VERSION.exe"
      - name: Package portable without invalidating signatures
        shell: pwsh
        run: .\scripts\package-portable.ps1 -SkipBuild
      - name: Generate and validate CycloneDX SBOM
        shell: pwsh
        run: .\scripts\generate-sbom.ps1
      - name: Stage allowlisted assets, provenance and SHA-256 checksums
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          SIGNED_RELEASE: ${{ steps.metadata.outputs.signed }}
        run: .\scripts\stage-release.ps1 -Version $env:RELEASE_VERSION -Signed:($env:SIGNED_RELEASE -eq 'true')
      - name: Upload verified release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SpeakTypeCloud-windows-x64-${{ github.sha }}
          path: dist/publish/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'SpeakTypeCloud-signing.pfx'
          if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true' && github.repository == 'stevenke1981/SpeakType-Cloud'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: speaktype-cloud-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: SpeakTypeCloud-windows-x64-${{ github.sha }}
          path: dist/publish/
          digest-mismatch: error
      - name: Publish verified assets without replacing an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: .\scripts\publish-release.ps1 -AssetDirectory .\dist\publish
